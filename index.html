<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamim vai Shera</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class=" mx-auto my-10 ">
    <header class="gap-10 ">
        <!-- nav var section -->
        <section>
            <nav class="flex justify-between justify-items-center items-center border border-[#000000] my-6">
                <div class="font-bold text-[28px] text-[#131313] ">
                    Book Vibe
                </div>
                <div>
                    <ul class="flex justify-between justify-items-center  items-center gap-4 ">
                        <li
                            class="font-semibold text-[18px] text-[#23BE0A] border border-[#23BE0A] px-5 py-3.5 rounded-lg">
                            Home</li>
                        <li class="py-3.5 px-[17px] text-[18px] text-[#131313]/80 "> Listed Books</li>
                        <li class="py-3.5 px-[17px] text-[18px] text-[#131313]/80 ">Page to Read </li>
                    </ul>
                </div>
                <div>
                    <button
                        class="px-7 py-4.5 text-white bg-[#23BE0A] rounded-lg font-semibold text-[18px] items-center ">
                        Sign in
                    </button>
                    <button
                        class="px-7 py-4.5 text-white bg-[#59C6D2] rounded-lg font-semibold text-[18px] items-center ">
                        Sign Up
                    </button>
                </div>
            </nav>
        </section>
        <!-- Hero Section -->
        <section>
            <div
                class="grid grid-cols-2 justify-between justify-items-center items-center bg-[#131313]/5 rounded-3xl py-8 my-8">
                <div class="space-y-12 rounded-lg pl-6">
                    <div class="font-bold text-[56px] text-[#131313] text-base/21">
                        Books to freshen up<br> your bookshelf
                    </div>
                    <div>
                        <button
                            class="bg-[#23BE0A] text-white px-7 py-5.25 text-[20px] font-bold rounded-lg items-center">
                            View The List
                        </button>

                    </div>
                </div>
                <div>
                    <img src="/assets/Banner.png" alt="">

                </div>
            </div>
        </section>
    </header>
    <main>
        <!-- Card Section -->
        <section>
            <h3 class="font-bold text-[40px] text-[#131313]">
                Books
            </h3>
            <div>
                <!-- 3 Coloum div -->
                <div>
                    <!-- 1 coloum div -->
                    <div class="bg-[#f3f3f3] justify-items-center rounded-2xl py-4.5">
                        <img src="/assets/book1.png" alt="">
                    </div>
                    <div>
                        <div>
                            <button
                                class="bg-[#23BE0A]/5 text-[#23BE0A] px-4 py-[7px] gap-2.5 rounded-[30px] font-medium text-[16px] ">
                                Young Adult
                            </button>
                            <button
                                class="bg-[#23BE0A]/5 text-[#23BE0A] px-4 py-[7px] gap-2.5 rounded-[30px] font-medium text-[16px] ">
                                identity
                            </button>
                        </div>
                        <div>
                            <h3 class="font-bold text-[24px] text-[#131313] items-start">
                                The Catcher in the Rye
                            </h3>
                            <p
                                class="font-medium text-[16px] text-[#131313]/80 items-end pb-5 border-b-2 border-dashed border-[#131313]/15">
                                By : Awlad Hossain
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </section>


    </main>
</body>

</html>
